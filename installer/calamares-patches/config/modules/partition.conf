# https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/partition/partition.conf
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "BOOT"
      minSize: 512MiB
      size: 1GiB
      filesystem: "ext4"
      mountPoint: "/boot"
      noEncrypt: true
    - name: "ROOT"
      minSize: 48GiB
      size: 100%
      filesystem: "ext4"
      mountPoint: "/"
