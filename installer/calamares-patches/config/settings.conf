modules-search: [ local, /run/current-system/sw/lib/calamares/modules ]

# =======================================================================
# Sequence in Calamares intaller
# =======================================================================

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser
  - netinstall
  - users
  - partition
  - summary
- exec:
  - partition
  - mount
  - foxflake
  - users
  - umount
- show:
  - finished

# =======================================================================
# Branding Path 
# =======================================================================

branding: nixos

# =======================================================================
# Options
# =======================================================================

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: true

hide-back-and-next-during-exec: false

quit-at-end: false
